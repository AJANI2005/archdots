# Mango - minimal config
# Reference: https://mangowm-mango.mintlify.app/

# --- Appearance: dark red aesthetic ---
gappih=10
gappiv=10
gappoh=10
gappov=4
borderpx=2
no_border_when_single=1
border_radius=6
rootcolor=0x141417ff
bordercolor=0x2a2a2eff
focuscolor=0x55555aff
maximizescreencolor=0x60606aff
urgentcolor=0x99945aff
globalcolor=0xd2d2d4ff
scratchpadcolor=0x77777eff
overlaycolor=0x55555aff

# --- Monitor: main display (1080p, 144Hz) ---
monitorrule=name:^eDP-1$,width:1920,height:1080,refresh:144,x:0,y:0,scale:1

# --- Window behavior ---
blur=1
shadows=0
animations=0
animation_type_open=fade
animation_type_close=fade
animation_duration_open=150
animation_duration_close=150
fadein_begin_opacity=0.0
sloppyfocus=1
warpcursor=1
focus_cross_tag=0
focus_cross_monitor=0
enable_floating_snap=0

# --- Window rules ---
# Auto-float common dialog/utility apps
windowrule=title:(GtkFileChooserDialog|Open File),isfloating:1,width:0.6,height:0.7
windowrule=appid:(org.gnome.Calculator|qalculate-gtk),isfloating:1
windowrule=appid:pavucontrol,isfloating:1,width:0.5,height:0.5
windowrule=appid:psensor,isfloating:1,width:0.5,height:0.5
windowrule=appid:blueman-manager,isfloating:1
windowrule=appid:nm-connection-editor,isfloating:1
windowrule=appid:system-config-printer,isfloating:1
windowrule=appid:(lxappearance|nitrogen),isfloating:1
windowrule=appid:org.keepassxc.KeePassXC,isfloating:1,width:0.5,height:0.5
windowrule=appid:(thunar|pcmanfm|org.gnome.Nautilus),isfloating:1

# Media players float
windowrule=appid:(mpv|vlc),isfloating:1

# Picture-in-Picture browser windows: float + always on top + sticky across tags
windowrule=title:(.*[Pp]icture.?[Ii]n.?[Pp]icture.*),isfloating:1,isoverlay:1,isglobal:1

# Games/launchers: fake-fullscreen, no blur
windowrule=title:(gamescope|Steam),isfakefullscreen:1,noblur:1


# --- Master-stack layout ---
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0
tag_num=9

# --- Tags: all tile layout ---
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# --- Input ---
xkb_rules_layout=us
repeat_rate=25
repeat_delay=600
numlockon=1
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_disable_while_typing=1
trackpad_natural_scrolling=1
swipe_min_threshold=0.5
mouse_natural_scrolling=0
cursor_size=24

# --- Launcher / terminal ---
bind=SUPER,Return,spawn,foot
bind=SUPER,space,spawn,fuzzel
bind=SUPER,e,spawn,thunar
bind=SUPER,b,spawn_shell,/home/ajani/apps/zen/zen

# --- System ---
bind=SUPER,r,reload_config
bind=SUPER+SHIFT,m,quit
bind=SUPER+SHIFT,l,spawn_shell,swaylock -f
bind=SUPER,q,killclient

# --- Focus movement (niri style: H/J/K/L + arrows) ---
bind=SUPER,Left,focusdir,left
bind=SUPER,h,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,j,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,k,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER,l,focusdir,right

# --- Move window (niri style: SUPER+SHIFT+H/J/K/L + arrows) ---
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,l,exchange_client,right

# --- View workspace (niri style: SUPER+1..9) ---
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# --- Move window to workspace (SUPER+SHIFT+1..9) ---
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# --- Workspace navigation ---
bind=SUPER+CTRL,Left,viewtoleft,0
bind=SUPER+CTRL,Right,viewtoright,0
bind=SUPER,Tab,focusstack,next

# --- Focus monitor ---
bind=SUPER+CTRL,Up,focusmon,up
bind=SUPER+CTRL,Down,focusmon,down

# --- Window states ---
bind=SUPER,f,togglemaximizescreen
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER,backslash,togglefloating
bind=SUPER,w,togglefloating
bind=SUPER,g,toggleglobal
bind=SUPER,i,minimized

# --- Layout ---
circle_layout=tile,scroller
bind=SUPER,t,switch_layout
bind=SUPER+SHIFT,t,spawn_shell,cur=$(mmsg -g -l | awk '{print $3}'); case "$cur" in tile) next=scroller;; scroller) next=vertical_scroller;; vertical_scroller) next=grid;; grid) next=monocle;; monocle) next=deck;; deck) next=center_tile;; center_tile) next=vertical_tile;; vertical_tile) next=right_tile;; right_tile) next=vertical_grid;; vertical_grid) next=vertical_deck;; vertical_deck) next=dwindle;; dwindle) next=fair;; fair) next=vertical_fair;; *) next=tile;; esac; mmsg dispatch setlayout,$next
bind=SUPER,n,switch_layout

# --- Rotate through workspaces ---
bind=SUPER,Page_Up,viewtoleft,0
bind=SUPER,Page_Down,viewtoright,0

# --- Audio (WirePlumber) ---
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause

# --- Brightness (brightnessctl) ---
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl s +2%
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl --min-value=1% s 2%-

# --- Screenshot ---
bind=SUPER,s,spawn_shell,grim -g "$(slurp)" - | swappy -f -
bind=SUPER+SHIFT,s,spawn_shell,grim - | swappy -f -

# --- Wallpaper (random from ~/wallpapers, recursive) ---
bind=SUPER+SHIFT,w,spawn_shell,p=$(find "$HOME"/wallpapers -type f \( -iname '*.jpg' -o -iname '*.png' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' \) | shuf -n1) && awww img --transition-fps 144 --transition-type random "$p"

# --- Status bar (eww in docker) ---
bind=SUPER+SHIFT,b,spawn_shell,/work/eww/toggle.sh

# --- Mouse ---
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# --- Scroll = workspace switch ---
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# --- Touchpad gestures ---
gesturebind=none,left,4,viewtoright_have_client
gesturebind=none,right,4,viewtoleft_have_client
gesturebind=none,left,3,focusstack,prev
gesturebind=none,right,3,focusstack,next

# --- Environment: GTK apps ---
env=GDK_BACKEND,wayland,x11
env=GTK_USE_PORTAL,1

# --- Environment: NVIDIA ---
env=__GLX_VENDOR_LIBRARY_NAME,nvidia
env=GBM_BACKEND,nvidia-drm
env=LIBVA_DRIVER_NAME,nvidia

# --- Autostart ---
exec-once=quickshell
exec-once=mako
exec-once=awww-daemon
exec-once=/usr/lib/xdg-desktop-portal-wlr
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once=swayidle -w timeout 300 'swaylock -f' timeout 600 'wlopm --off \*' resume 'wlopm --on \*' before-sleep 'swaylock -f'
